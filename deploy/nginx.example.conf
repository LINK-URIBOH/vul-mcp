# Merge into nginx.conf http {}.
limit_req_zone $binary_remote_addr zone=vul_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=vul_login:10m rate=2r/s;

# Merge locations into the existing vul.valna.cn HTTPS server {}.
# Preserve your certificate directives. Upstream ports match .env defaults.
server {
    listen 443 ssl;
    server_name vul.valna.cn;
    # ssl_certificate ...;
    # ssl_certificate_key ...;
    client_max_body_size 1m;

    location = /mcp {
        limit_req zone=vul_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /.well-known/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_cache off;
    }
    location ^~ /auth/realms/ {
        limit_req zone=vul_login burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
    location ^~ /auth/resources/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
    # Keycloak admin console stays on the loopback upstream, reachable via SSH forwarding.
    location ^~ /auth/admin/ { return 404; }
    location ^~ /auth/health/ { return 404; }
    location ^~ /auth/ { return 404; }
    location = /healthz { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
}
