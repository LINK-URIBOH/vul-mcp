[project]
name = "vul-intel"
version = "1.5.0"
description = "Cloud MCP vulnerability intelligence service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp==2.3.0", "uvicorn>=0.38,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3",
  "jinja2>=3.1.6,<4", "beautifulsoup4>=4.13,<5", "feedparser>=6,<7",
  "pydantic-settings>=2.10,<3",
  "ijson>=3.4,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
