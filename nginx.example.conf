# Merge the limit_req_zone into nginx.conf's http {} block (NOT server/location).
limit_req_zone $binary_remote_addr zone=vul_mcp_per_ip:10m rate=5r/s;

# Merge this location into your existing vul.valna.cn HTTPS server {} block.
# Keep your existing listen 443 ssl, certificate and DNS configuration.
server {
    listen 443 ssl;
    server_name vul.valna.cn;

    # Set your existing ssl_certificate / ssl_certificate_key here.

    location = /mcp {
        limit_req zone=vul_mcp_per_ip burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        # No trailing slash, no rewrite: upstream must receive exactly /mcp.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    # Optional: the Docker health route remains loopback-only.
    location / {
        return 404;
    }
}
